<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="out.css">
<style>
  :root{--op-gold-rgb:217 164 65}
  body{margin:0;background:#0b1230}
  .font-display{font-family:Oxanium,system-ui,sans-serif}
</style>
</head><body>
<header class="relative z-30 h-16 w-full flex-shrink-0 border-b border-cyan-200/20 bg-[linear-gradient(180deg,_rgba(10,28,66,0.82),_rgba(3,9,24,0.9))] sm:h-20">
  <div class="flex h-full w-full items-stretch gap-2 overflow-hidden px-3 sm:gap-2 sm:px-6">
    <div class="relative z-10 flex flex-shrink-0 items-center justify-center py-1">
      <div class="h-[2rem] w-[6rem] bg-white sm:h-[2.8rem]"></div>
    </div>
    <nav class="relative z-10 ml-1 hidden h-full min-w-0 flex-1 items-stretch gap-1 pl-3 sm:ml-6 sm:flex sm:gap-2 sm:pl-4">
      <span class="flex items-center px-4 font-heading text-base font-black uppercase tracking-[0.06em] text-white/60 sm:px-7 sm:text-lg">Home</span>
      <span class="flex items-center px-4 font-heading text-base font-black uppercase tracking-[0.06em] text-white/60 sm:px-7 sm:text-lg">Play</span>
      <span class="flex items-center px-4 font-heading text-base font-black uppercase tracking-[0.06em] text-white/60 sm:px-7 sm:text-lg">Decks</span>
      <span class="flex items-center px-4 font-heading text-base font-black uppercase tracking-[0.06em] text-white/60 sm:px-7 sm:text-lg">Social</span>
      <span class="flex items-center px-4 font-heading text-base font-black uppercase tracking-[0.06em] text-white/60 sm:px-7 sm:text-lg">Settings</span>
    </nav>

    <button type="button" class="group relative z-10 ml-auto flex h-full flex-shrink-0 items-center">
      <span aria-hidden="true" class="absolute inset-y-1 left-0 right-0 hidden transition-colors duration-200 md:block bg-white/15" style="clip-path:polygon(0 0,100% 0,100% 100%,2.6rem 100%)"></span>
      <span aria-hidden="true" class="absolute inset-y-[5px] left-px right-px hidden transition-colors duration-200 md:block bg-[linear-gradient(100deg,_rgba(10,28,66,0.9)_0%,_rgba(3,9,24,0.85)_60%)]" style="clip-path:polygon(0 0,100% 0,100% 100%,2.6rem 100%)"></span>

      <span class="relative flex h-full items-center gap-2 py-1 pl-1 pr-1 md:gap-3.5 md:pl-3 md:pr-5">
        <span class="hidden shrink-0 flex-col items-center self-start pt-1.5 leading-none md:flex">
          <span class="text-[9px] font-bold uppercase tracking-[0.18em] text-white/50">Lv</span>
          <span class="mt-0.5 font-display text-lg font-black leading-none text-[rgb(var(--op-gold-rgb))]">3</span>
        </span>

        <span class="shrink-0 transition-all duration-200 opacity-95">
          <span class="hidden md:block">
            <span class="relative inline-flex shrink-0" style="width:70px;height:61px">
              <span class="absolute inset-0 overflow-hidden bg-[#0a1226]" style="clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%)">
                <span class="block h-full w-full" style="background:#3a4a6b"></span>
              </span>
              <svg viewBox="0 0 100 86.6025" preserveAspectRatio="none" class="pointer-events-none absolute inset-0 h-full w-full">
                <path d="M26.125 2.250 L73.875 2.250 L97.750 43.301 L73.875 84.353 L26.125 84.353 L2.250 43.301 Z" fill="none" stroke="rgba(217,164,65,0.75)" stroke-width="4.5" stroke-linejoin="round"/>
              </svg>
            </span>
          </span>
        </span>

        <span class="hidden min-w-0 flex-col items-start justify-center text-left md:flex">
          <span class="max-w-[10rem] truncate font-display text-base font-black uppercase tracking-[0.08em] text-white lg:max-w-[14rem] lg:text-lg">CroixShadow</span>
          <span class="mt-1 flex min-w-0 items-center gap-1.5">
            <span class="relative inline-flex shrink-0 items-center justify-center" style="width:24px;height:24px">
              <span class="block rounded-full" style="width:88%;height:88%;background:rgba(255,255,255,0.28)"></span>
            </span>
            <span class="min-w-0 truncate text-[11px] font-bold uppercase tracking-[0.12em] text-white/55">Placement</span>
          </span>
        </span>
      </span>
    </button>
  </div>
</header>
</body></html>
