<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#13329a" />

    <!-- ============================================================
         SEO / social meta
         NOTE: absolute URLs below use the production origin. If you
         attach a custom domain, replace every "https://one-piece-tcg-online.vercel.app"
         occurrence with it (canonical + og:url + og:image + twitter:image).
         ============================================================ -->
    <title>One Piece TCG Online — Play the One Piece Card Game in Your Browser</title>
    <meta name="description" content="A free, rules-accurate One Piece Card Game simulator. Build decks with live card data and battle online — right in your browser." />
    <meta name="application-name" content="One Piece TCG Online" />
    <meta name="apple-mobile-web-app-title" content="OP TCG" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://one-piece-tcg-online.vercel.app/" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="One Piece TCG Online" />
    <meta property="og:title" content="One Piece TCG Online" />
    <meta property="og:description" content="A free, rules-accurate One Piece Card Game simulator. Build decks with live card data and battle online — right in your browser." />
    <meta property="og:url" content="https://one-piece-tcg-online.vercel.app/" />
    <meta property="og:image" content="https://one-piece-tcg-online.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="One Piece TCG Online — play the One Piece Card Game in your browser" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="One Piece TCG Online" />
    <meta name="twitter:description" content="A free, rules-accurate One Piece Card Game simulator. Build decks and battle online in your browser." />
    <meta name="twitter:image" content="https://one-piece-tcg-online.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="One Piece TCG Online" />
    <style>
      /* --- Native splash: renders before any JS bundle arrives ----------- */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #13329a;
        background-image: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, transparent 14%);
      }

      #splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 38%, rgba(255,211,74,0.13) 0%, transparent 55%);
        pointer-events: none;
      }

      #splash::after {
        content: "";
        position: absolute;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        width: 10rem;
        height: 0.5rem;
        border-left: 2px solid rgba(217,164,65,0.35);
        border-right: 2px solid rgba(217,164,65,0.35);
        background: linear-gradient(90deg, transparent, rgba(217,164,65,0.85), transparent);
      }

      #splash-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2.5rem;
      }

      #splash-logo-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }

      #splash-logo {
        /* Height + the art's own ratio, matching BrandLogo.tsx — this is the
           pre-boot copy of the same mark and the two must not differ, or the
           logo visibly resizes the moment React mounts. */
        max-width: 86vw;
        aspect-ratio: 218.92 / 77.48;
        height: 5.6rem;
        background: linear-gradient(180deg, #ffe17a 0%, #d9a441 50%, #8e5b12 100%);
        -webkit-mask-image: url(/ui/new-icon.svg);
        mask-image: url(/ui/new-icon.svg);
        -webkit-mask-position: center;
        mask-position: center;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-size: contain;
        mask-size: contain;
        filter: drop-shadow(0 7px 0 rgba(0,0,0,0.65));
      }

      /* Progress bar */
      #splash-progress-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
        width: min(72vw, 22rem);
      }

      #splash-bar-track {
        width: 100%;
        height: 3px;
        background: rgba(255,255,255,0.08);
        border-radius: 99px;
        overflow: hidden;
      }

      #splash-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #8e5b12, #d9a441, #ffe17a);
        border-radius: 99px;
        /* Creep from 0→5% during bundle download; JS overrides via inline style */
        animation: splash-creep 3s ease-out forwards;
        transition: width 0.25s ease-out;
      }

      @keyframes splash-creep {
        from { width: 0%; }
        to   { width: 5%; }
      }

      #splash-label {
        font-family: 'Segoe UI', sans-serif;
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.3);
        margin: 0;
      }
    </style>
  </head>
  <body style="margin:0;background:#13329a;">
    <!-- Native splash — visible immediately, before any JS loads -->
    <div id="splash">
      <div id="splash-inner">
        <div id="splash-logo-wrap">
          <div id="splash-logo" aria-label="OPTCG YoHoHo!"></div>
        </div>

        <div id="splash-progress-wrap">
          <div id="splash-bar-track">
            <div id="splash-bar"></div>
          </div>
          <p id="splash-label">Loading&hellip;</p>
        </div>
      </div>
    </div>

    <script>
      // Expose a global so JS (useAppInit) can drive the progress bar
      // even before React fully takes over. Inline style beats the CSS
      // animation, so the first call to __splashProgress() cancels the creep.
      window.__splashProgress = function(pct) {
        var bar   = document.getElementById('splash-bar');
        var label = document.getElementById('splash-label');
        if (bar)   bar.style.width = pct + '%';
        if (label) label.textContent = Math.round(pct) + '%';
      };
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
